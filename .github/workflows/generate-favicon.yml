name: Generate Favicon
on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Favicon and Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick & pngquant
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick pngquant

      - name: Make generate script executable
        run: |
          chmod +x scripts/generate-favicon.sh

      - name: Run favicon generation script
        run: |
          ./scripts/generate-favicon.sh

      - name: Commit generated icons (use PAT)
        env:
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # configure git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # stage generated files (if any)
          git add public/favicon.ico || true
          git add public/icons/*.png || true

          # nothing to commit?
          if git diff --cached --quiet; then
            echo "No generated icons to commit"
            exit 0
          fi

          git commit -m "chore(ci): generate favicon.ico and icon PNGs"

          # default branch fallback if BRANCH is empty (workflow_dispatch should set branch, but be safe)
          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi

          # set remote URL using PAT and push to the same branch the workflow was run on
          git remote set-url origin https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git
          git push origin HEAD:${BRANCH}
