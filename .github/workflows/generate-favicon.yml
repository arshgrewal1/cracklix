name: Generate Favicon
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (no credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # important: do NOT persist GITHUB_TOKEN into git

      - name: Install ImageMagick & pngquant
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick pngquant

      - name: Make generate script executable
        run: |
          chmod +x scripts/generate-favicon.sh

      - name: Run favicon generation script
        run: |
          ./scripts/generate-favicon.sh

      - name: Commit generated icons (use PAT)
        env:
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/favicon.ico || true
          git add public/icons/*.png || true

          if git diff --cached --quiet; then
            echo "No generated icons to commit"
            exit 0
          fi

          git commit -m "chore(ci): generate favicon.ico and icon PNGs"

          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi

          # Push using PAT in the remote URL
          git push https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git HEAD:${BRANCH}
